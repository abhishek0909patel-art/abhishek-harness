services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: abhishek-harness/api:${TAG:-latest}
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
